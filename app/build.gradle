plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pintask.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pintask.app'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '2.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    signingConfigs {
        release {
            if (System.getenv('PINTASK_KEYSTORE_PATH')) {
                storeFile file(System.getenv('PINTASK_KEYSTORE_PATH'))
                storePassword System.getenv('PINTASK_KEYSTORE_PASSWORD')
                keyAlias 'pintask'
                keyPassword System.getenv('PINTASK_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
