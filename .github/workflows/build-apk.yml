name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 36 platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Check shift time calculations
        run: |
          javac -d /tmp/pintask-tests app/src/main/java/com/pintask/app/ShiftTimes.java tests/ShiftTimesTest.java
          java -cp /tmp/pintask-tests com.pintask.app.ShiftTimesTest
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PinTask-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
