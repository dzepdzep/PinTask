plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pintask.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pintask.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
