name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 36 platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PINTASK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pintask-release.p12"
      - name: Test and assemble signed APK
        env:
          PINTASK_KEYSTORE_PATH: ${{ runner.temp }}/pintask-release.p12
          PINTASK_KEYSTORE_PASSWORD: ${{ secrets.PINTASK_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk"
      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/pintask-release.p12"
      - name: Check shift time calculations
        run: |
          javac -d /tmp/pintask-tests app/src/main/java/com/pintask/app/ShiftTimes.java tests/ShiftTimesTest.java
          java -cp /tmp/pintask-tests com.pintask.app.ShiftTimesTest
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PinTask-installable-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Prepare release files
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+\x27([^\x27]+)\x27.*/\1/p" app/build.gradle | head -1)"
          test -n "$VERSION"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "PinTask-${VERSION}.apk"
          sha256sum "PinTask-${VERSION}.apk" > SHA256SUMS
      - name: Publish signed GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${RELEASE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Bump versionName and versionCode for each new app release."
            exit 0
          fi
          gh release create "$TAG" "PinTask-${RELEASE_VERSION}.apk" SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "PinTask ${RELEASE_VERSION}" \
            --notes "Signed installable APK. Install over your existing PinTask; do not uninstall or local data will be erased. Automated tests and signature verification passed. Real-device notification behavior has not been verified." \
            --generate-notes
