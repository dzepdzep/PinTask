name: Build Battery Care APK

on:
  push:
    branches: [battery-care-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v4
      - name: Extract Battery Care source
        run: |
          test -f BatteryCare-source.tar.xz
          tar -xJf BatteryCare-source.tar.xz
          test -f BatteryCare/app/build.gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform from runner SDK
        run: |
          echo "Using Android SDK at ${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          chmod +x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests and build debug APK
        working-directory: BatteryCare
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK for installation
        uses: actions/upload-artifact@v4
        with:
          name: BatteryCare-v0.1.0-debug-apk
          path: BatteryCare/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
