name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 36 platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PINTASK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pintask-release.p12"
      - name: Test and assemble signed APK
        env:
          PINTASK_KEYSTORE_PATH: ${{ runner.temp }}/pintask-release.p12
          PINTASK_KEYSTORE_PASSWORD: ${{ secrets.PINTASK_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk"
      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/pintask-release.p12"
      - name: Check shift time calculations
        run: |
          javac -d /tmp/pintask-tests app/src/main/java/com/pintask/app/ShiftTimes.java tests/ShiftTimesTest.java
          java -cp /tmp/pintask-tests com.pintask.app.ShiftTimesTest
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PinTask-installable-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
