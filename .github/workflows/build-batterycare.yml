name: Build Battery Care APK

on:
  push:
    branches: [battery-care-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v4
      - name: Verify and extract Battery Care v0.2.0
        run: |
          echo "1380d4dbce2d032547518b6315adeaa03ef835ed31accb09961ebe52a9453f9c  BatteryCare-source.tar.xz" | sha256sum --check -
          tar -xJf BatteryCare-source.tar.xz
          test -f BatteryCare/app/build.gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform from runner SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore existing developer signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PINTASK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/batterycare-release.p12"
          test -s "$RUNNER_TEMP/batterycare-release.p12"
      - name: Run tests and build signed Battery Care APK
        working-directory: BatteryCare
        env:
          PINTASK_KEYSTORE_PATH: ${{ runner.temp }}/batterycare-release.p12
          PINTASK_KEYSTORE_PASSWORD: ${{ secrets.PINTASK_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose BatteryCare/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging BatteryCare/app/build/outputs/apk/release/app-release.apk | grep "package: name='com.batterycare.app' versionCode='2'"
      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/batterycare-release.p12"
      - name: Upload signed installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryCare-v0.2.0-signed-apk
          path: BatteryCare/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish Battery Care as a normal GitHub Release
        if: github.ref == 'refs/heads/battery-care-build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="batterycare-v0.2.0"
          APK="BatteryCare-v0.2.0.apk"
          cp BatteryCare/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > BatteryCare-v0.2.0-SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The Battery Care release already exists; not overwriting a published APK."
            gh release view "$TAG" --json url -q .url
          else
            gh release create "$TAG" "$APK" BatteryCare-v0.2.0-SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Battery Care v0.2.0 (Android app)" \
              --notes "Battery Care is a standalone Android app, not a PinTask update. Includes Start Fresh / Check All, powered-off maintenance schedules, controller profiles, reminders and backup/restore. This is an ordinary signed release built and tested automatically. First-time users should install the APK and test the 60-second alarm with the phone locked. Users of the earlier debug-signed v0.1.0 may need to export data, uninstall the debug APK, install this signed APK, then restore data. The separate app is temporarily hosted in the PinTask repository until a dedicated repository exists." \
              --latest=false
          fi
