name: Build Battery Care APK

on:
  push:
    branches: [battery-care-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v4
      - name: Verify Battery Care source archive
        run: |
          test -f BatteryCare-v0.1.0-source.zip || {
            echo "::error::Upload BatteryCare-v0.1.0-source.zip to this branch first."
            exit 1
          }
          unzip -t BatteryCare-v0.1.0-source.zip
          unzip -qo BatteryCare-v0.1.0-source.zip
          test -f BatteryCare/app/build.gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run tests and build debug APK
        working-directory: BatteryCare
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publish installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryCare-v0.1.0-debug-apk
          path: BatteryCare/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
